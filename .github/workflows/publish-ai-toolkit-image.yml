name: Publish AI Toolkit training image

on:
  workflow_dispatch:
    inputs:
      ai_toolkit_revision:
        description: Immutable AI Toolkit Git commit to build
        required: true
        default: 0e4b6e8695ae836f463eacfde16de695337492e2
        type: string
      image_tag:
        description: GHCR tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          push: true
          build-args: |
            AI_TOOLKIT_REVISION=${{ inputs.ai_toolkit_revision }}
          tags: ghcr.io/${{ github.repository_owner }}/ai-toolkit-job:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
